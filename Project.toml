name = "HTMXObjects"
uuid = "b12ef442-5798-4353-80f3-9562b03a0cb6"
authors = ["Nikolas Siccha <nikolassiccha@gmail.com>"]
version = "0.1.0"

[deps]
DynamicObjects = "23d02862-63fe-4c6e-8fdb-1d52cbbd39d5"
HTMX = "27f3e1ef-6ef8-44dc-9e9a-2fb23ed44e83"
HTTP = "cd3eb016-35fb-5094-929b-558a96fad6f3"
LibGit2 = "76f85450-5226-5b5a-8eaa-529ad045b433"
Markdown = "d6f4376e-aef5-505a-96c1-9c027394607a"
Oxygen = "df9a0d86-3283-4920-82dc-4555fc0d1d8b"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Tables = "bd369af6-aec1-5ad0-b16a-f7cc5008161c"

[weakdeps]
Treebars = "e1e568c4-3a56-40a4-95fa-9b9c6c16fccb"

[extensions]
HTMXObjectsTreebarsExt = "Treebars"

[compat]
HTMX = "1"
# HTTP 2.x removed the `@logfmt_str` string macro that `src/HTMXObjects.jl`'s
# access-log line relies on (still exported by HTTP 1.x). Pinning HTTP to 1.x
# also transitively holds Oxygen at 1.10.x (Oxygen 1.11.0 requires HTTP ^2.4),
# which is the dependency world this package's Oxygen-wrapping code is written
# against. Without this, Julia >=1.11 resolves HTTP 2.x + Oxygen 1.11.0 and
# precompilation fails at the `logfmt"..."` line. See snag logfmt-str-undef.
HTTP = "1"
julia = "1"
TestItemRunner = "1"

[extras]
Sockets = "6462fe0b-24de-5631-8697-dd941f90decc"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"
TestItemRunner = "f8b46487-2199-4994-9208-9a1283c18c0a"
Treebars = "e1e568c4-3a56-40a4-95fa-9b9c6c16fccb"

[sources.Treebars]
url = "https://github.com/nsiccha/Treebars.jl"
rev = "42be351bdbdcbf22572da5c8cf896fcc39047126"

[targets]
test = ["Sockets", "Test", "TestItemRunner", "Treebars"]
