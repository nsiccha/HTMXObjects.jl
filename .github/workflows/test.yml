name: Run tests
on:
  push:
    branches: [master, main, dev, devibe]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  actions: write
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: ['lts', '1', 'pre']
        julia-arch: [x64]
        os: [ubuntu-latest, windows-latest, macOS-latest]
        exclude:
          - os: macOS-latest
            julia-arch: x86
    steps:
      - uses: actions/checkout@v4
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/cache@v2
      - name: Install unregistered dependencies
        run: julia --project=. test/provision.jl
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run tests
        shell: bash
        run: |
          set +e
          julia --project=. --color=no -e 'using Pkg; Pkg.test(; coverage=true)' 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Failed test log tail'
              echo '```text'
              tail -n 500 test-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            details=$(awk '
              /Test Failed|Error During Test|Some tests did not pass/ { remaining = 100 }
              remaining > 0 { print; remaining-- }
            ' test-output.log | tail -n 300)
            [ -n "$details" ] || details=$(tail -n 160 test-output.log)
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error title=Pkg.test failure details::$details"
          fi
          exit "$status"
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1'
      - uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1'
        with:
          fail_ci_if_error: false
