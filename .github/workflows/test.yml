name: Run tests
on:
  push:
    branches: [master, main, dev, devibe]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  actions: write
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: ['lts', '1', 'pre']
        julia-arch: [x64]
        os: [ubuntu-latest, windows-latest, macOS-latest]
        exclude:
          - os: macOS-latest
            julia-arch: x86
    steps:
      - uses: actions/checkout@v4
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/cache@v2
      - name: Install unregistered dependencies
        run: |
          git clone -b dev https://github.com/nsiccha/DynamicObjects.jl.git
          git clone -b dev https://github.com/nsiccha/HTMX.jl.git
          git clone https://github.com/nsiccha/Treebars.jl.git
          cp Project.toml Project.toml.test-backup
          julia --project -e '
            using Pkg
            packages = [
              PackageSpec(path="DynamicObjects.jl"),
              PackageSpec(path="HTMX.jl"),
            ]
            VERSION < v"1.11" && push!(packages, PackageSpec(path="Treebars.jl"))
            Pkg.develop(packages)
          '
          mv Project.toml.test-backup Project.toml
          julia --project -e 'using Pkg; Pkg.resolve()'
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run tests
        run: julia --project=. -e 'using Pkg; Pkg.test(; coverage=true)'
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1'
      - uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1'
        with:
          fail_ci_if_error: false
